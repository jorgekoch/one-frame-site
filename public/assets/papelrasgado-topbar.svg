<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="222" viewBox="0 0 1920 222" preserveAspectRatio="none">
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="contrast">
        <feFuncR type="linear" slope="0.55" intercept="0.20"/>
        <feFuncG type="linear" slope="0.55" intercept="0.20"/>
        <feFuncB type="linear" slope="0.55" intercept="0.20"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="contrast" mode="multiply"/>
    </filter>
    <filter id="paperShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
